<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calc — Precision, refined.</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="stage">

  <aside class="history-panel" id="historyPanel">
    <div class="history-head">
      <p class="history-title">History</p>
      <button class="history-clear" id="clearHistoryBtn">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <p class="history-empty" id="historyEmpty">Your calculations will appear here.</p>
    </div>
  </aside>

  <div class="calc">
    <div class="calc-head">
      <span class="brand">CALC</span>
      <button class="history-toggle" id="historyToggle" aria-label="Toggle history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 12a9 9 0 1 0 9-9" stroke-linecap="round" />
          <path d="M3 5v5h5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <div class="display-wrap">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="display" id="display">0</div>
    </div>

    <div class="keys">
      <button class="key key-fn" data-action="clear">AC</button>
      <button class="key key-fn" data-action="negate">+/-</button>
      <button class="key key-fn" data-action="percent">%</button>
      <button class="key key-op" data-action="divide">÷</button>

      <button class="key key-num" data-num="7">7</button>
      <button class="key key-num" data-num="8">8</button>
      <button class="key key-num" data-num="9">9</button>
      <button class="key key-op" data-action="multiply">×</button>

      <button class="key key-num" data-num="4">4</button>
      <button class="key key-num" data-num="5">5</button>
      <button class="key key-num" data-num="6">6</button>
      <button class="key key-op" data-action="subtract">−</button>

      <button class="key key-num" data-num="1">1</button>
      <button class="key key-num" data-num="2">2</button>
      <button class="key key-num" data-num="3">3</button>
      <button class="key key-op" data-action="add">+</button>

      <button class="key key-num key-zero" data-num="0">0</button>
      <button class="key key-num" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>
  </div>

</div>

<script src="calculator.js"></script>
</body>
</html>
